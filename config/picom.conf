# Picom configuration for DreamWM: enable compositing and vertical sync.
# Copy to ~/.config/picom/picom.conf and start picom before DreamWM.

backend = "glx";
vsync = true;

# Keep compositing enabled for fullscreen windows; unredirecting can reintroduce tearing.
unredir-if-possible = false;

# Avoid stale/damaged regions on drivers that exhibit tearing with damage tracking.
use-damage = false;

# Keep animations/fades out of the way; this config focuses on tear-free presentation.
fading = false;
